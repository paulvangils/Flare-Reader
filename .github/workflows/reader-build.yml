name: Flare Reader build

on:
  workflow_dispatch:
  push:
    branches:
      - reader-v1
      - reader-v3
      - reader-v3.7-work

permissions:
  contents: read

# Keep this in sync with Android's versionName. Increase only when a release
# is ready to be published; existing version tags are never silently replaced.
env:
  FLARE_RELEASE_VERSION: '3.7.3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-v3_7_validation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Java runtime
        run: java -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Verify only approved Flare internals changed
        run: |
          BASE=8d8c0239041b1c63dc32a5239fb5e913ec73e0fb
          ALLOWED_1="shared/src/commonMain/kotlin/dev/dimension/flare/data/datasource/microblog/paging/TimelineRemoteMediator.kt"
          ALLOWED_2="shared/src/commonMain/kotlin/dev/dimension/flare/ui/presenter/home/TimelinePresenter.kt"
          ALLOWED_3="shared/src/commonMain/kotlin/dev/dimension/flare/ui/presenter/home/MixedTimelinePresenter.kt"
          ALLOWED_4="shared/src/commonMain/kotlin/dev/dimension/flare/data/datasource/microblog/MixedRemoteMediator.kt"
          ALLOWED_5="social/xqt/src/commonMain/kotlin/dev/dimension/flare/data/datasource/xqt/XQTDataSource.kt"
          ALLOWED_6="social/xqt/src/commonMain/kotlin/dev/dimension/flare/data/datasource/xqt/XQTRetweetersLoader.kt"
          ALLOWED_7="social/xqt/src/commonMain/kotlin/dev/dimension/flare/data/datasource/xqt/XQTDataSource.kt"
          ALLOWED_8="social/xqt/src/commonMain/kotlin/dev/dimension/flare/data/datasource/xqt/SearchStatusPagingSource.kt"
          ALLOWED_9="social/bluesky/src/commonMain/kotlin/dev/dimension/flare/data/datasource/bluesky/BlueskyDataSource.kt"
          ALLOWED_10="social/bluesky/src/commonMain/kotlin/dev/dimension/flare/data/datasource/bluesky/SearchStatusRemoteMediator.kt"
          git diff --name-only "$BASE" --             shared/src/commonMain/kotlin/dev/dimension/flare/data/datasource/microblog/paging             shared/src/commonMain/kotlin/dev/dimension/flare/data/datasource/microblog/MixedRemoteMediator.kt             shared/src/commonMain/kotlin/dev/dimension/flare/data/database/cache             shared/src/commonMain/kotlin/dev/dimension/flare/data/network             shared/src/commonMain/kotlin/dev/dimension/flare/shared/image             shared/src/commonMain/kotlin/dev/dimension/flare/ui/presenter/home/TimelinePresenter.kt             shared/src/commonMain/kotlin/dev/dimension/flare/ui/presenter/home/MixedTimelinePresenter.kt             social             | while read -r path; do
                if [ "$path" != "$ALLOWED_1" ] && [ "$path" != "$ALLOWED_2" ] && [ "$path" != "$ALLOWED_3" ] && [ "$path" != "$ALLOWED_4" ] && [ "$path" != "$ALLOWED_5" ] && [ "$path" != "$ALLOWED_6" ] && [ "$path" != "$ALLOWED_7" ] && [ "$path" != "$ALLOWED_8" ] && [ "$path" != "$ALLOWED_9" ] && [ "$path" != "$ALLOWED_10" ]; then
                  echo "Unexpected protected-code change: $path"
                  exit 1
                fi
              done

      - name: Prepare stable debug signing
        run: |
          base64 -d ci/flare-reader-debug.keystore.b64 > reader-debug.keystore
          cat > signing.properties <<'EOF'
          storeFile=reader-debug.keystore
          storePassword=android
          keyAlias=flare-reader-debug
          keyPassword=android
          EOF

      - name: Run reader regression tests
        run: ./gradlew :shared:jvmTest :compose-ui:jvmTest :app:testDebugUnitTest --info --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flare-reader-test-reports
          path: |
            compose-ui/build/test-results/jvmTest/
            compose-ui/build/reports/tests/jvmTest/
          if-no-files-found: ignore

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_VERSION: ${{ env.FLARE_RELEASE_VERSION }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flare-reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish_release:
    name: Publish Flare APK release
    needs: build
    if: github.ref == 'refs/heads/reader-v3.7-work' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: flare-reader-release-publication
      cancel-in-progress: false
    steps:
      - name: Download verified APK from the successful build
        uses: actions/download-artifact@v4
        with:
          name: flare-reader-debug-apk
          path: release-artifact

      - name: Publish versioned APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${FLARE_RELEASE_VERSION}"
          APK="Flare-Reader-${TAG}.apk"

          # A version is immutable: new development commits cannot overwrite an
          # already published APK. Bump FLARE_RELEASE_VERSION for the next release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. No new release necessary."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG exists without a release. Resolve it manually."
            exit 1
          fi

          test -s release-artifact/app-debug.apk
          cp release-artifact/app-debug.apk "$APK"
          sha256sum "$APK" > "${APK}.sha256"

          gh release create "$TAG" "$APK" "${APK}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Flare Reader ${TAG}" \
            --notes "Flare Reader ${TAG} voor Android. Alle automatische tests en de APK-build zijn geslaagd. Download hieronder rechtstreeks het APK-bestand en installeer het over de bestaande app. Verwijder je bestaande app of gegevens niet. Deze APK is ondertekend met de bestaande Flare Reader-testondertekening." \
            --latest

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}"
          {
            echo "### Flare Reader ${TAG} published"
            echo
            echo "Directe APK-download: [${APK}](${URL})"
          } >> "$GITHUB_STEP_SUMMARY"
