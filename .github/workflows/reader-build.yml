name: Flare Reader build

on:
  workflow_dispatch:
  push:
    branches:
      - reader-v1
      - reader-v3
      - reader-v3.1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Java runtime
        run: java -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Verify Reader change isolation
        run: |
          cat > /tmp/reader-allowed-files.txt <<'EOF'
          .github/workflows/reader-build.yml
          app/src/main/java/dev/dimension/flare/ui/screen/home/HomeTimelineScreen.kt
          ci/flare-reader-debug.keystore.b64
          compose-ui/src/commonMain/kotlin/dev/dimension/flare/ui/presenter/TimelineWithLazyListState.kt
          compose-ui/src/commonTest/kotlin/dev/dimension/flare/ui/presenter/TimelineWithLazyListStateTest.kt
          shared/src/commonMain/kotlin/dev/dimension/flare/data/datastore/AppDataStore.kt
          shared/src/commonMain/kotlin/dev/dimension/flare/data/datastore/model/ReaderPositionData.kt
          shared/src/commonMain/kotlin/dev/dimension/flare/data/datasource/microblog/paging/TimelineRemoteMediator.kt
          shared/src/commonMain/kotlin/dev/dimension/flare/data/repository/ReaderPositionRepository.kt
          shared/src/commonMain/kotlin/dev/dimension/flare/ui/presenter/home/TimelinePresenter.kt
          shared/src/commonTest/kotlin/dev/dimension/flare/data/datasource/microblog/MixedRemoteMediatorTest.kt
          shared/src/commonTest/kotlin/dev/dimension/flare/data/repository/ReaderPositionRepositoryTest.kt
          shared/src/commonTest/kotlin/dev/dimension/flare/ui/presenter/home/TimelinePresenterBindingTest.kt
          EOF
          git diff --name-only 8d8c0239041b1c63dc32a5239fb5e913ec73e0fb...HEAD > /tmp/reader-changed-files.txt
          unexpected="$(grep -vxFf /tmp/reader-allowed-files.txt /tmp/reader-changed-files.txt || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi
          git diff --exit-code 8d8c0239041b1c63dc32a5239fb5e913ec73e0fb...HEAD --             shared/src/commonMain/kotlin/dev/dimension/flare/data/database/cache             shared/src/commonMain/kotlin/dev/dimension/flare/data/network             shared/src/commonMain/kotlin/dev/dimension/flare/shared/image             social

      - name: Prepare stable debug signing
        run: |
          base64 -d ci/flare-reader-debug.keystore.b64 > reader-debug.keystore
          cat > signing.properties <<'EOF'
          storeFile=reader-debug.keystore
          storePassword=android
          keyAlias=flare-reader-debug
          keyPassword=android
          EOF

      - name: Run reader regression tests
        run: ./gradlew :shared:jvmTest :compose-ui:jvmTest --info --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flare-reader-test-reports
          path: |
            compose-ui/build/test-results/jvmTest/
            compose-ui/build/reports/tests/jvmTest/
          if-no-files-found: ignore

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_VERSION: reader-v3.1-${{ github.run_number }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flare-reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
